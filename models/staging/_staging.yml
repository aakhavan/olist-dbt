version: 2
models:
- name: stg_customers
  description: 'Staging of raw customers table: typed columns kept, no enrichment.
    One row per raw customer_id.'
  config:
    meta:
      primary_key:
      - customer_id
  columns:
  - name: customer_id
    description: Raw customer_id (business key). Text from raw.olist_customers_dataset.customer_id,
      empty text as null; primary key; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    description: Person-level customer key. Text from raw.olist_customers_dataset.customer_unique_id,
      empty text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: customer_zip_code_prefix
    description: Zip code prefix. Text from raw.olist_customers_dataset.customer_zip_code_prefix,
      empty text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: customer_city
    description: City. Text from raw.olist_customers_dataset.customer_city, empty
      text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: customer_state
    description: State. Text from raw.olist_customers_dataset.customer_state, empty
      text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
- name: stg_orders
  description: 'Staging of raw orders: typed timestamps and status. One row per raw
    order_id.'
  config:
    meta:
      primary_key:
      - order_id
  columns:
  - name: order_id
    description: Order identifier. Text from raw.olist_orders_dataset.order_id, empty
      text as null; primary key; never null.
    data_tests:
    - unique
    - not_null
  - name: customer_id
    description: Customer_id (per-order id), used to join to customers for person
      key. Text from raw.olist_orders_dataset.customer_id, empty text as null; never
      null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: order_status
    description: Order lifecycle status (e.g. delivered, canceled, unavailable, etc.).
      Text from raw.olist_orders_dataset.order_status, empty text as null; never null.
  - name: order_purchase_timestamp
    description: Purchase timestamp. Timestamp from raw.olist_orders_dataset.order_purchase_timestamp,
      cast from text to timestamp, empty text as null; never null.
  - name: order_approved_at
    description: Approval timestamp. Timestamp from raw.olist_orders_dataset.order_approved_at,
      cast from text to timestamp, empty text as null; rarely null (under 1%).
  - name: order_delivered_carrier_date
    description: Delivered to carrier timestamp. Timestamp from raw.olist_orders_dataset.order_delivered_carrier_date,
      cast from text to timestamp, empty text as null; sometimes null (1 to 10%).
  - name: order_delivered_customer_date
    description: Delivered to customer timestamp. Timestamp from raw.olist_orders_dataset.order_delivered_customer_date,
      cast from text to timestamp, empty text as null; sometimes null (1 to 10%).
  - name: order_estimated_delivery_date
    description: Estimated delivery date. Timestamp from raw.olist_orders_dataset.order_estimated_delivery_date,
      cast from text to timestamp, empty text as null; never null.
- name: stg_order_items
  description: 'Staging of raw order items: one row per order item (order_id, order_item_id)
    with price and freight.'
  config:
    meta:
      primary_key:
      - order_id
      - order_item_id
  columns:
  - name: order_id
    description: Order id (foreign key to orders). Text from raw.olist_order_items_dataset.order_id,
      empty text as null; part of the primary key (order_id, order_item_id); never
      null.
  - name: order_item_id
    description: Item line id within order. Integer from raw.olist_order_items_dataset.order_item_id,
      cast from text to integer, empty text as null; part of the primary key (order_id,
      order_item_id); never null.
  - name: product_id
    description: Product identifier. Text from raw.olist_order_items_dataset.product_id,
      empty text as null; never null.
  - name: seller_id
    description: Seller identifier. Text from raw.olist_order_items_dataset.seller_id,
      empty text as null; never null.
  - name: shipping_limit_date
    description: Shipping limit date. Timestamp from raw.olist_order_items_dataset.shipping_limit_date,
      cast from text to timestamp, empty text as null; never null.
  - name: price
    description: Item price. Numeric from raw.olist_order_items_dataset.price, cast
      from text to numeric, empty text as null; never null.
  - name: freight_value
    description: Freight value for the item. Numeric from raw.olist_order_items_dataset.freight_value,
      cast from text to numeric, empty text as null; never null.
- name: stg_order_payments
  description: 'Staging of raw order payments: one row per payment attempt for an
    order.'
  config:
    meta:
      primary_key:
      - order_id
      - payment_sequential
  columns:
  - name: order_id
    description: Order id. Text from raw.olist_order_payments_dataset.order_id, empty
      text as null; part of the primary key (order_id, payment_sequential); never
      null.
  - name: payment_sequential
    description: Payment attempt sequence. Integer from raw.olist_order_payments_dataset.payment_sequential,
      cast from text to integer, empty text as null; part of the primary key (order_id,
      payment_sequential); never null.
  - name: payment_type
    description: Payment method. Text from raw.olist_order_payments_dataset.payment_type,
      empty text as null; never null.
  - name: payment_installments
    description: Installments. Integer from raw.olist_order_payments_dataset.payment_installments,
      cast from text to integer, empty text as null; never null.
  - name: payment_value
    description: Payment value. Numeric from raw.olist_order_payments_dataset.payment_value,
      cast from text to numeric, empty text as null; never null.
- name: stg_order_reviews
  description: Staging of raw order reviews. Keep review metadata; drop free-text
    comment columns from downstream by default.
  config:
    meta:
      primary_key:
      - review_id
      - order_id
  columns:
  - name: review_id
    description: Review identifier. Text from raw.olist_order_reviews_dataset.review_id,
      empty text as null; part of the primary key (review_id, order_id); never null.
  - name: order_id
    description: Order id the review refers to. Text from raw.olist_order_reviews_dataset.order_id,
      empty text as null; part of the primary key (review_id, order_id); never null.
  - name: review_score
    description: Integer review score. Integer from raw.olist_order_reviews_dataset.review_score,
      cast from text to integer, empty text as null; never null.
  - name: review_comment_title
    description: Free text title (PII); excluded from gold by default. Text from raw.olist_order_reviews_dataset.review_comment_title,
      empty text as null; mostly null (over 50%); personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: review_comment_message
    description: Free text message (PII); excluded from gold by default. Text from
      raw.olist_order_reviews_dataset.review_comment_message, empty text as null;
      mostly null (over 50%); personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: review_creation_date
    description: When the review was created. Timestamp from raw.olist_order_reviews_dataset.review_creation_date,
      cast from text to timestamp, empty text as null; never null.
  - name: review_answer_timestamp
    description: Answer timestamp; used to pick latest review per order. Timestamp
      from raw.olist_order_reviews_dataset.review_answer_timestamp, cast from text
      to timestamp, empty text as null; never null.
- name: stg_products
  description: 'Staging of raw products: typed product attributes.'
  config:
    meta:
      primary_key:
      - product_id
  columns:
  - name: product_id
    description: Product identifier. Text from raw.olist_products_dataset.product_id,
      empty text as null; primary key; never null.
    data_tests:
    - unique
    - not_null
  - name: product_category_name
    description: Raw category name. Text from raw.olist_products_dataset.product_category_name,
      empty text as null; sometimes null (1 to 10%).
  - name: product_name_lenght
    description: Product name length. Integer from raw.olist_products_dataset.product_name_lenght,
      cast from text to integer, empty text as null; sometimes null (1 to 10%).
  - name: product_description_lenght
    description: Description length. Integer from raw.olist_products_dataset.product_description_lenght,
      cast from text to integer, empty text as null; sometimes null (1 to 10%).
  - name: product_photos_qty
    description: Photos count. Integer from raw.olist_products_dataset.product_photos_qty,
      cast from text to integer, empty text as null; sometimes null (1 to 10%).
  - name: product_weight_g
    description: Weight in grams. Integer from raw.olist_products_dataset.product_weight_g,
      cast from text to integer, empty text as null; rarely null (under 1%).
  - name: product_length_cm
    description: Length in cm. Integer from raw.olist_products_dataset.product_length_cm,
      cast from text to integer, empty text as null; rarely null (under 1%).
  - name: product_height_cm
    description: Height in cm. Integer from raw.olist_products_dataset.product_height_cm,
      cast from text to integer, empty text as null; rarely null (under 1%).
  - name: product_width_cm
    description: Width in cm. Integer from raw.olist_products_dataset.product_width_cm,
      cast from text to integer, empty text as null; rarely null (under 1%).
- name: stg_sellers
  description: Staging of raw sellers.
  config:
    meta:
      primary_key:
      - seller_id
  columns:
  - name: seller_id
    description: Seller identifier. Text from raw.olist_sellers_dataset.seller_id,
      empty text as null; primary key; never null.
    data_tests:
    - unique
    - not_null
  - name: seller_zip_code_prefix
    description: Seller zip code prefix. Text from raw.olist_sellers_dataset.seller_zip_code_prefix,
      empty text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: seller_city
    description: Seller city. Text from raw.olist_sellers_dataset.seller_city, empty
      text as null; never null; personal data, hashed for analysts.
    config:
      meta:
        pii: true
  - name: seller_state
    description: Seller state. Text from raw.olist_sellers_dataset.seller_state, empty
      text as null; never null.
- name: stg_product_category_name_translation
  description: Staging of category name translations.
  config:
    meta:
      primary_key:
      - product_category_name
  columns:
  - name: product_category_name
    description: Raw category name. Text from raw.product_category_name_translation.product_category_name,
      empty text as null; primary key; never null.
    data_tests:
    - unique
    - not_null
  - name: product_category_name_english
    description: English translation. Text from raw.product_category_name_translation.product_category_name_english,
      empty text as null; never null.
