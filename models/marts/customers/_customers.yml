version: 2
models:
- name: kpi_avg_review_score
  description: 'Mean review score with one review per order (the latest answer), by purchase month; companion: the share of reviews scoring 2 or less.'
  config:
    meta:
      kpi_id: avg_review_score
      owner: Amir Akhavan (customer experience)
      source_tier: platform
      source_ref: https://aboutamazon.com/news/retail/amazon-customer-reviews-star-ratings
