      rendered_sha256: 3342b3c95522153f88220eed070aa4c9a9c452244ad7c9c28775ca3efb63e1e5
  columns:
  - name: month
    description: The month (grain of Average review score).
    data_tests:
    - not_null
  - name: avg_review_score
    description: 'Average review score per month: Mean review score with one review per order (the latest answer), by purchase month; companion: the share of reviews scoring 2 or less.'
  - name: low_score_share
    description: 'Low score share, a companion value of Average review score per month: Mean review score with one review per order (the latest answer), by purchase month; companion: the share of reviews scoring 2 or less.'
- name: kpi_repeat_purchase_rate
  description: 'Customers with 2 or more valid orders divided by customers with at least 1 valid order, over the whole dataset. Customers are counted by the person-level key (Olist: customer_unique_id), not the per-order id.'
