      rendered_sha256: 747b2b6a1340244ca47b402679a0c5bb522f8ad0bc483ee70596275e92853495
  columns:
  - name: cohort_month
    description: The cohort month (grain of Monthly cohort retention).
    data_tests:
    - not_null
  - name: months_since_first
    description: 'Months since first, a companion value of Monthly cohort retention per cohort month: Cohort = month of a customer''s first valid order. Retention in month k = cohort customers with a valid order in the k-th month after the cohort month, divided by cohort size. Cells whose month is the last (incomplete) month of data are flagged.'
  - name: retention
    description: 'Retention, a companion value of Monthly cohort retention per cohort month: Cohort = month of a customer''s first valid order. Retention in month k = cohort customers with a valid order in the k-th month after the cohort month, divided by cohort size. Cells whose month is the last (incomplete) month of data are flagged.'
  - name: incomplete_month
    description: 'Incomplete month, a companion value of Monthly cohort retention per cohort month: Cohort = month of a customer''s first valid order. Retention in month k = cohort customers with a valid order in the k-th month after the cohort month, divided by cohort size. Cells whose month is the last (incomplete) month of data are flagged.'
