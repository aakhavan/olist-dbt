      rendered_sha256: 0790fcc8c26e84961f86fa549c4a1b5f487f3e0e255096b3bf8cd753ca16ce11
  columns:
  - name: customers
    description: 'Customers, a companion value of Repeat purchase rate per total: Customers with 2 or more valid orders divided by customers with at least 1 valid order, over the whole dataset. Customers are counted by the person-level key (Olist: customer_unique_id), not the per-order id.'
  - name: repeat_purchase_rate
    description: 'Repeat purchase rate per total: Customers with 2 or more valid orders divided by customers with at least 1 valid order, over the whole dataset. Customers are counted by the person-level key (Olist: customer_unique_id), not the per-order id.'
- name: kpi_cohort_retention
  description: Cohort = month of a customer's first valid order. Retention in month k = cohort customers with a valid order in the k-th month after the cohort month, divided by cohort size. Cells whose month is the last (incomplete) month of data are flagged.
  config:
    meta:
      kpi_id: cohort_retention
      owner: Amir Akhavan (analytics)
      source_tier: platform
      source_ref: https://support.google.com/analytics/answer/9670133?hl=en
