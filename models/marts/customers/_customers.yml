    meta:
      kpi_id: repeat_purchase_rate
      owner: Amir Akhavan (analytics)
      source_tier: platform
      source_ref: https://help.shopify.com/manual/reports-and-analytics/shopify-reports/report-types/customers-reports?r=ecm-bfs
